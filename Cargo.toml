[package]
name = "jayins"
version = "0.1.0"
edition = "2021"
description = "Instagram 帖子图片下载器"

[dependencies]
eframe = "0.29"
egui = "0.29"
reqwest = { version = "0.12", features = ["json", "cookies"] }
headless_chrome = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
url = "2"
anyhow = "1"
regex = "1"
dirs-next = "2"
